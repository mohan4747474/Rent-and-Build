services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rentbuild
      MYSQL_USER: rentbuild
      MYSQL_PASSWORD: rentbuild_dev_password
      MYSQL_ROOT_PASSWORD: rentbuild_root_dev_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - rentbuild-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prentbuild_root_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rentbuild-mysql:
