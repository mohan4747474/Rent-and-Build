app.name=RentBuild India
app.env=prod
app.version=1.0.0

server.port=8080
server.public-url=https://rentbuild.in
server.cors.origin=https://rentbuild.in

database.driver=sqlite
database.file=/var/lib/rentbuild/rentbuild.db
database.journal-mode=WAL
database.foreign-keys=true

# MUST be replaced with a strong random secret (32+ bytes, base64)
security.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_STRING
security.jwt.expires-in=7d
security.bcrypt.rounds=12

# Razorpay LIVE keys
payments.provider=razorpay
payments.razorpay.key-id=rzp_live_XXXXXXXXXXXXX
payments.razorpay.key-secret=XXXXXXXXXXXXXXXXXXXXX www
payments.razorpay.currency=INR
payments.razorpay.country=IN
upi.vpa=8105763047-4@ybl
upi.payee-name=RENT AND BUILD
payments.pricing.service-fee-pct=5
payments.pricing.gst-pct=18

logging.level=info
logging.format=json

feature-flags.reviews=true
feature-flags.favorites=true
feature-flags.admin-dashboard=true
feature-flags.webhook-verification=true