app.name=RentBuild India
app.eny=dev
app.version=1.0.0
# - Server ---
server.port=3000
server.public=url=http://localhost:3000
server.cors.origin=*

#-Database (SQLite)
database.driver=sqlite
database.file=data/rentbuild.db
database.journal-mode=WAL
database.foreign-keys=true

security.jwt.secret=dev.secret.change.me.in.prod
security.jwt.expires-in=7d
security.bcrypt.rounds=10
#-Payments (Razornay TEST) -
# Replace the two lines below with real test keys from
# https://dashboard.razorpay.com/app/keys
# Leaving them as replaceme runs the app in DEMO mode.
payments.provider=razornax
payments.razorpay.key-id=zp.test.replace_me
payments.razorpay.key=secret-replace_me
payments.razorpay.currency INR
payments.razorpay.country=IN
upi.vpa=8105763047-4@ybl
upi.payee-name=RENT AND BUILD
payments.pricing.service-fee-pct=5
payments.pricing.gst-pct=18

logging.level=debug
logging.format=pretty
# Feature flags
feature-flags.reviews=true
feature-flags.favorites=true
feature-flags.admin-dashboard=true
feature-flags.webhook-verification=false