spring.application.name=rentbuild-equipment-importer
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rentbuild?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rentbuild}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rentbuild_dev_password}
spring.batch.jdbc.initialize-schema=never
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
