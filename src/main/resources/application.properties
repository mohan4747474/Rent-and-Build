spring.application.name=rentbuild-equipment-importer
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rentbuild}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rentbuild}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rentbuild}
spring.batch.jdbc.initialize-schema=never
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
